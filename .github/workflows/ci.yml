name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m backend.app.cli advisories validate
      - run: python -m backend.app.cli repository validate
      - run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Start local application containers
        run: docker compose up --build --detach backend frontend
      - name: Verify local API and dashboard
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/health > /tmp/logialog-health.json; then
              break
            fi
            if [ "$attempt" = 60 ]; then
              docker compose logs backend frontend
              exit 1
            fi
            sleep 2
          done
          grep --quiet '"status":"ok"' /tmp/logialog-health.json
          curl --fail --silent --show-error http://127.0.0.1:5173/ | grep --quiet "LOGIALOG"
          curl --fail --silent --show-error http://127.0.0.1:8000/api/demo | grep --quiet '"domain":"demo.local"'
      - name: Verify isolated fictional lab
        shell: bash
        run: |
          set -euo pipefail
          docker compose --profile lab up --build --detach lab
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:8010/ > /tmp/logialog-lab.html; then
              break
            fi
            if [ "$attempt" = 60 ]; then
              docker compose --profile lab logs lab
              exit 1
            fi
            sleep 2
          done
          grep --quiet "DONNÉES FICTIVES" /tmp/logialog-lab.html
          grep --quiet "aucun payload exploitable" /tmp/logialog-lab.html
      - name: Stop local containers
        if: always()
        run: docker compose --profile lab down --volumes
