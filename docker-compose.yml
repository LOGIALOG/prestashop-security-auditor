services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./reports:/app/reports"]
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5173:5173"]
    depends_on: [backend]
  lab:
    profiles: ["lab"]
    build:
      context: .
      dockerfile: lab/Dockerfile
    ports: ["127.0.0.1:8010:8010"]
